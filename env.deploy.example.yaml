# Copy this to  env.deploy.yaml  (which is gitignored) and fill in your values.
# These become the backend's environment variables on Cloud Run.
#
#   cp env.deploy.example.yaml env.deploy.yaml   (then edit)
#
# SUPABASE_SERVICE_KEY and ENCRYPTION_KEY are SECRETS — never commit them.

SUPABASE_URL: "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY: "sb_publishable_xxx"          # public/anon key
SUPABASE_SERVICE_KEY: "sb_secret_xxx"            # SECRET service-role key
ENCRYPTION_KEY: "your-fernet-key"                # SECRET (same one as local backend/.env)
FRONTEND_ORIGINS: "https://aitechh.co,https://www.aitechh.co"
