name: CI/CD — build & deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: project-08e315e8-ebbe-42f6-9ac
  REGION: europe-west1
  SERVICE: aitech

jobs:
  # ── CI: catch breakage before deploying ──────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply private overlay (if configured)
        env:
          OVERLAY_REPO: ${{ secrets.OVERLAY_REPO }}
          OVERLAY_TOKEN: ${{ secrets.OVERLAY_TOKEN }}
        run: |
          if [ -z "$OVERLAY_TOKEN" ] || [ -z "$OVERLAY_REPO" ]; then
            echo "No overlay configured — building public-only."; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${OVERLAY_TOKEN}@github.com/${OVERLAY_REPO}.git" _overlay
          cp -r _overlay/backend/. backend/
          cp -r _overlay/frontend/. frontend/
          rm -rf _overlay
          echo "Overlay applied."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend — install, typecheck, build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend — install & import check
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import app.main; print('backend imports OK')"

  # ── CD: deploy to Cloud Run (only on push to main) ───────────
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Apply private overlay (if configured)
        env:
          OVERLAY_REPO: ${{ secrets.OVERLAY_REPO }}
          OVERLAY_TOKEN: ${{ secrets.OVERLAY_TOKEN }}
        run: |
          if [ -z "$OVERLAY_TOKEN" ] || [ -z "$OVERLAY_REPO" ]; then
            echo "No overlay configured — deploying public-only."; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${OVERLAY_TOKEN}@github.com/${OVERLAY_REPO}.git" _overlay
          cp -r _overlay/backend/. backend/
          cp -r _overlay/frontend/. frontend/
          rm -rf _overlay
          echo "Overlay applied."

      - id: auth
        name: Authenticate to Google Cloud (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/521506558837/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-08e315e8-ebbe-42f6-9ac.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --memory 512Mi \
            --quiet
        # Note: backend env vars (Supabase keys, ENCRYPTION_KEY, FRONTEND_ORIGINS)
        # already live on the Cloud Run service and are preserved across deploys,
        # so no secrets are needed in CI.

      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format="value(status.url)"
